name: Build APK

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_CONTENT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install latest Apktool release (not a dirty build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/apktool"
          curl -fsSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o "$HOME/apktool/apktool"
          gh release download --repo iBotPeaches/Apktool --pattern 'apktool_*.jar' --dir "$HOME/apktool"
          mv "$HOME/apktool"/apktool_*.jar "$HOME/apktool/apktool.jar"
          chmod +x "$HOME/apktool/apktool"
          echo "$HOME/apktool" >> "$GITHUB_PATH"

      - name: Build with Apktool
        run: |
          apktool --version
          mkdir -p dist
          apktool b . -o dist/unsigned.apk

      - name: Prepare release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
        run: echo "$KEYSTORE_CONTENT" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Align and sign
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            KS="$RUNNER_TEMP/release.jks"; ALIAS="$KEYSTORE_ALIAS"; PASS="$KEYSTORE_PASSWORD"
          else
            KS="$RUNNER_TEMP/debug.jks"; ALIAS="key"; PASS="android"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug"
          fi
          "$BT/zipalign" -f -p 4 dist/unsigned.apk dist/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" --out dist/C.apk dist/aligned.apk
          "$BT/apksigner" verify dist/C.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: C-apk
          path: dist/C.apk
          if-no-files-found: error

      - name: Publish GitHub release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}-${GITHUB_SHA::7}"
          cp dist/C.apk "C-$tag.apk"
          gh release create "$tag" "C-$tag.apk" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "$(git log -1 --pretty=%B)"
