name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install latest Apktool release (not a dirty build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/apktool"
          curl -fsSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o "$HOME/apktool/apktool"
          gh release download --repo iBotPeaches/Apktool --pattern 'apktool_*.jar' --dir "$HOME/apktool"
          mv "$HOME/apktool"/apktool_*.jar "$HOME/apktool/apktool.jar"
          chmod +x "$HOME/apktool/apktool"
          echo "$HOME/apktool" >> "$GITHUB_PATH"

      - name: Build
        run: |
          apktool --version
          mkdir -p dist
          apktool b . -o dist/unsigned.apk

      - name: Align and sign (debug key)
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug"
          "$BT/zipalign" -f -p 4 dist/unsigned.apk dist/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/debug.jks" --ks-pass pass:android --key-pass pass:android \
            --out dist/C.apk dist/aligned.apk
          "$BT/apksigner" verify dist/C.apk

      - uses: actions/upload-artifact@v4
        with:
          name: C-apk
          path: dist/C.apk
